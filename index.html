<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Satisfactory">
<meta name="theme-color" content="#0b0e13">
<meta name="description" content="Factory planner and progress tracker for Satisfactory — production chains, alternate recipes, power, belts and Space Elevator phases.">
<title>Satisfactory Manager</title>
<script>
  // Canonical host is *.firebaseapp.com (same-origin Google sign-in). Send browser tabs on *.web.app there.
  // Never redirect a home-screen app: leaving its origin would kick it out to Safari.
  (function () {
    var from = 'satisfactory-manager-c75e7.web.app', to = 'satisfactory-manager-c75e7.firebaseapp.com';
    var standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    if (location.hostname === from && !standalone) location.replace('https://' + to + location.pathname + location.search + location.hash);
  })();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>
<div id="splash" class="splash" aria-hidden="true">
  <img src="icons/icon.svg" alt="" width="88" height="88">
  <div class="splash-bar"><i></i></div>
</div>

<div id="gate" class="gate hidden"></div>

<div id="app" class="app hidden">
  <nav id="nav" class="nav" aria-label="Main"></nav>
  <main id="view" class="main"></main>
</div>

<div id="sheet-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
